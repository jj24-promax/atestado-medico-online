<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Proof Popup - Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #5f6b7a;
      --accent: #1f7f73;
      --bg: #ffffff;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.12);
      --border: rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f7f9fb 0%, #f1f5f9 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    /* Apenas para demonstração visual da página */
    .demo-card {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }

    .demo-card h1 {
      margin: 0 0 8px;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .demo-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Popup de prova social */
    .social-proof {
      position: fixed;
      left: 18px;
      bottom: 18px;
      width: min(360px, calc(100vw - 24px));
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px 14px;
      z-index: 9999;
      pointer-events: none;

      /* estado inicial escondido */
      opacity: 0;
      transform: translateY(14px);
      visibility: hidden;
      transition:
        opacity 300ms ease,
        transform 300ms ease,
        visibility 300ms ease;
    }

    .social-proof.is-visible {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .social-proof__icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(31, 127, 115, 0.1);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .social-proof__text {
      margin: 1px 0 0;
      font-size: 0.92rem;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
    }

    .social-proof__text strong {
      color: var(--accent);
      font-weight: 700;
    }

    .social-proof__sub {
      margin-top: 3px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .social-proof {
        left: 10px;
        bottom: 10px;
        width: min(330px, calc(100vw - 20px));
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <main class="demo-card">
    <h1>Demo de Social Proof Popup</h1>
    <p>
      Este arquivo demonstra um sistema de notificações de prova social para páginas de alta conversão.
      O popup aparece automaticamente no canto inferior esquerdo, com dados dinâmicos e animação suave.
    </p>
  </main>

  <aside id="socialProof" class="social-proof" aria-live="polite" aria-atomic="true">
    <div class="social-proof__icon" aria-hidden="true">
      <!-- Ícone check simples -->
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>
    <div>
      <p id="socialProofText" class="social-proof__text"></p>
      <p class="social-proof__sub">Atendimento 24h • Documento digital válido</p>
    </div>
  </aside>

  <script>
    // Listas fáceis de editar
    const NOMES = [
      "Joao", "Maria", "Lucas", "Ana", "Pedro", "Juliana", "Rafael", "Camila",
      "Bruno", "Larissa", "Gustavo", "Beatriz", "Thiago", "Fernanda", "Matheus",
      "Amanda", "Felipe", "Patricia", "Diego", "Carolina", "Vinicius", "Natália"
    ];

    const CIDADES = [
      "SP", "RJ", "MG", "BA", "PR", "RS", "SC", "GO", "PE", "CE",
      "DF", "ES", "PA", "AM", "MT", "MS", "AL"
    ];

    const TEMPOS = [
      "agora mesmo",
      "ha 1 minuto",
      "ha 2 minutos",
      "ha 3 minutos",
      "ha 4 minutos",
      "ha 5 minutos",
      "ha 6 minutos"
    ];

    // Frases base (com placeholders)
    const FRASES = [
      "{nome} - {cidade} acabou de solicitar um atestado",
      "{nome} - {cidade} recebeu seu atestado",
      "{nome} - {cidade} finalizou o pedido {tempo}",
      "{nome} - {cidade} concluiu a solicitacao {tempo}",
      "{nome} - {cidade} gerou o atestado com sucesso"
    ];

    const popup = document.getElementById("socialProof");
    const popupText = document.getElementById("socialProofText");

    let ultimoNome = "";
    let ultimaCidade = "";
    let exibindo = false;

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // Evita repetir o mesmo item em sequencia
    function pickNonRepeating(arr, lastValue) {
      if (arr.length <= 1) return arr[0];
      let value = pickRandom(arr);
      while (value === lastValue) {
        value = pickRandom(arr);
      }
      return value;
    }

    function montarMensagem() {
      const nome = pickNonRepeating(NOMES, ultimoNome);
      const cidade = pickNonRepeating(CIDADES, ultimaCidade);
      const tempo = pickRandom(TEMPOS);
      const fraseBase = pickRandom(FRASES);

      ultimoNome = nome;
      ultimaCidade = cidade;

      return fraseBase
        .replace("{nome}", "<strong>" + nome + "</strong>")
        .replace("{cidade}", "<strong>" + cidade + "</strong>")
        .replace("{tempo}", tempo);
    }

    function showPopup() {
      if (exibindo) return;
      exibindo = true;
      popupText.innerHTML = montarMensagem();
      popup.classList.add("is-visible");

      // Fica visivel por 4 segundos
      setTimeout(() => {
        popup.classList.remove("is-visible");
        exibindo = false;
      }, 4000);
    }

    function loopNotifications() {
      // Intervalo aleatorio entre 5 e 10 segundos
      const delay = Math.floor(Math.random() * 5000) + 5000;
      setTimeout(() => {
        showPopup();
        loopNotifications();
      }, delay);
    }

    // Mostra a primeira com pequeno atraso para nao ser agressivo
    setTimeout(showPopup, 1200);
    loopNotifications();
  </script>
</body>
</html>
