<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Testar geração de QR PIX</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; margin-top: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; font-size: 12px; }
    .ok { color: green; }
    .erro { color: #c00; }
    .qr { margin: 1rem 0; }
    .qr img { max-width: 220px; display: block; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <h1>Testar geração de QR code PIX</h1>
  <p>Esta página chama a API de pagamento e exibe o resultado (redirect, QR ou erro).</p>
  <p>Use no mesmo domínio do site (ex.: <code>https://www.atestadomed.com.br/testar-pagamento.html</code>).</p>
  <button type="button" id="btn">Gerar pagamento de teste (R$ 37,90)</button>
  <div id="resultado"></div>

  <script src="config-api.js"></script>
  <script>
    (function () {
      var base = window.location.origin;
      var path = (typeof window.PAYMENT_API_PATH !== 'undefined' && window.PAYMENT_API_PATH) ? window.PAYMENT_API_PATH : '/api/create-payment';
      var apiUrl = base.replace(/\/$/, '') + path;
      var btn = document.getElementById('btn');
      var out = document.getElementById('resultado');

      btn.addEventListener('click', function () {
        out.innerHTML = '<p>Chamando API...</p>';
        btn.disabled = true;

        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: 37.90,
            name: 'Teste QR',
            email: 'teste@teste.com',
            cpf: '52998224725',
            phone: '11999999999',
            itemTitle: 'Atestado Médico'
          })
        })
          .then(function (r) {
            return r.text().then(function (text) {
              var data = null;
              try {
                data = text ? JSON.parse(text) : null;
              } catch (e) {
                if (r.status === 403) {
                  return { status: 403, data: { error: 'Acesso negado (403). Se estiver usando o PHP: o servidor precisa executar PHP. A Vercel não executa PHP — use uma hospedagem com PHP ou corrija a rota Node na Vercel.' } };
                }
                if (r.status === 404) {
                  return { status: 404, data: { error: 'Rota não encontrada (404). Confira se a pasta api/ está no deploy (Vercel) ou se o arquivo PHP está no servidor correto.' } };
                }
                return { status: r.status, data: { error: 'A API retornou uma página de erro em vez de JSON (ex.: 403 ou 404). Verifique a URL: ' + path } };
              }
              return { status: r.status, data: data };
            });
          })
          .then(function (res) {
            var html = '';
            if (res.status === 200 && res.data) {
              var pix = res.data.pix || {};
              if (res.data.pix && res.data.pix.url) {
                html = '<p class="ok">OK: API retornou URL de pagamento. Redirecionando...</p>';
                html += '<p><a href="' + res.data.pix.url + '" target="_blank" rel="noopener">Abrir tela de pagamento Fusion Pay</a></p>';
                window.open(res.data.pix.url, '_blank');
              } else if (res.data.pix && (res.data.pix.qr_code || res.data.pix.e2_e)) {
                html = '<p class="ok">QR code / PIX copia e cola recebido:</p>';
                if (res.data.pix.qr_code) {
                  html += '<div class="qr"><img src="' + res.data.pix.qr_code + '" alt="QR Code" /></div>';
                }
                if (res.data.pix.e2_e) {
                  html += '<p><strong>PIX copia e cola:</strong><br><code style="word-break:break-all">' + res.data.pix.e2_e + '</code></p>';
                }
              } else {
                html = '<p class="ok">Resposta 200 sem URL/QR (ver objeto abaixo):</p>';
              }
              html += '<pre>' + JSON.stringify(res.data, null, 2) + '</pre>';
            } else {
              html = '<p class="erro">Erro ' + res.status + ': ' + (res.data && res.data.error ? res.data.error : 'Resposta inválida') + '</p>';
              if (res.data) html += '<pre>' + JSON.stringify(res.data, null, 2) + '</pre>';
            }
            out.innerHTML = html;
            btn.disabled = false;
          })
          .catch(function (err) {
            var msg = err.message || 'Erro desconhecido';
            if (msg.indexOf('not valid JSON') !== -1 || msg.indexOf('Unexpected token') !== -1) {
              msg = 'A API retornou HTML ou texto em vez de JSON (geralmente 403 ou 404). Se usar PHP, o domínio precisa estar em um servidor que execute PHP (a Vercel não executa PHP).';
            }
            out.innerHTML = '<p class="erro">Falha na requisição: ' + msg + '</p><p>URL chamada: <code>' + apiUrl + '</code></p>';
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
